<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Orbiting Case Files Projects Scene Concept</title>
  <desc id="desc">Project panels orbiting a central poly core with connector particles.</desc>
  <defs>
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f1b2f" />
      <stop offset="55%" stop-color="#081322" />
      <stop offset="100%" stop-color="#040913" />
    </radialGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23d5ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#23d5ff" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#6d7dff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#be7bff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2bff" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#4ed7ff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7ffff0" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="polyGradient" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#73f9ff" />
      <stop offset="50%" stop-color="#3f8cff" />
      <stop offset="100%" stop-color="#a069ff" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1440" height="720" fill="url(#spaceGradient)" />
  <g filter="url(#softGlow)">
    <ellipse cx="720" cy="360" rx="480" ry="180" fill="#2b9aff" fill-opacity="0.08" />
  </g>
  <g stroke="url(#ringGradient)" stroke-width="6" fill="none" opacity="0.85">
    <ellipse cx="720" cy="360" rx="420" ry="220" />
    <ellipse cx="720" cy="360" rx="320" ry="160" stroke-opacity="0.6" stroke-dasharray="28 16" />
    <ellipse cx="720" cy="360" rx="230" ry="110" stroke-opacity="0.5" stroke-dasharray="14 14" />
  </g>
  <g fill="#7de4ff" fill-opacity="0.35">
    <circle cx="310" cy="210" r="6" />
    <circle cx="450" cy="520" r="5" />
    <circle cx="620" cy="150" r="4" />
    <circle cx="820" cy="600" r="6" />
    <circle cx="1030" cy="260" r="5" />
    <circle cx="1150" cy="420" r="4" />
    <circle cx="910" cy="140" r="4" />
    <circle cx="560" cy="640" r="6" />
  </g>
  <g transform="translate(720,360)">
    <polygon points="0,-110 94,-40 74,88 -36,120 -120,30" fill="url(#polyGradient)" stroke="#9fe7ff" stroke-width="3" />
    <polygon points="0,-110 74,88 -36,120" fill="#061537" opacity="0.45" />
    <polygon points="0,-110 94,-40 -120,30" fill="#1c2f66" opacity="0.35" />
  </g>
  <g font-family="'Inter', Arial, sans-serif" font-size="18" fill="#e7faff" text-anchor="middle">
    <g transform="translate(360,220) rotate(-12)">
      <rect x="-150" y="-90" width="300" height="180" rx="22" fill="url(#panelGradient)" stroke="#75f4ff" stroke-opacity="0.4" stroke-width="2" />
      <text y="-16" font-size="20">AI Coaching Assistant</text>
      <text y="20" font-size="14" fill="#c8f5ff">Guided onboarding with Codex</text>
    </g>
    <g transform="translate(520,540) rotate(8)">
      <rect x="-140" y="-80" width="280" height="160" rx="20" fill="url(#panelGradient)" stroke="#75f4ff" stroke-opacity="0.35" stroke-width="2" />
      <text y="-8" font-size="20">Observability Hub</text>
      <text y="24" font-size="14" fill="#c8f5ff">Serverless dashboards</text>
    </g>
    <g transform="translate(910,520) rotate(-6)">
      <rect x="-150" y="-90" width="300" height="180" rx="22" fill="url(#panelGradient)" stroke="#75f4ff" stroke-opacity="0.4" stroke-width="2" />
      <text y="-16" font-size="20">Design System Revamp</text>
      <text y="20" font-size="14" fill="#c8f5ff">Token-driven theming</text>
    </g>
    <g transform="translate(1080,280) rotate(10)">
      <rect x="-140" y="-80" width="280" height="160" rx="20" fill="url(#panelGradient)" stroke="#75f4ff" stroke-opacity="0.35" stroke-width="2" />
      <text y="-8" font-size="20">Realtime Collab</text>
      <text y="24" font-size="14" fill="#c8f5ff">CRDT whiteboarding</text>
    </g>
  </g>
  <g stroke="#78c6ff" stroke-opacity="0.25" stroke-width="1.8">
    <line x1="720" y1="360" x2="360" y2="220" />
    <line x1="720" y1="360" x2="520" y2="540" />
    <line x1="720" y1="360" x2="910" y2="520" />
    <line x1="720" y1="360" x2="1080" y2="280" />
  </g>
</svg>
