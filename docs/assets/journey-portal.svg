<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Journey Portal Hero Scene Concept</title>
  <desc id="desc">Glassy orb surrounded by light ribbon and four holographic cards representing discovery beats.</desc>
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1f1d47" />
      <stop offset="50%" stop-color="#111022" />
      <stop offset="100%" stop-color="#05040d" />
    </radialGradient>
    <radialGradient id="orbGradient" cx="52%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#73f6ff" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#47b3ff" stop-opacity="0.7" />
      <stop offset="85%" stop-color="#5d49ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1b1464" stop-opacity="0.2" />
    </radialGradient>
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7ee8" stop-opacity="0" />
      <stop offset="20%" stop-color="#ff7ee8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#7ef9ff" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#9f7cff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4b3bff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#111dff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#46c7ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0.18" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGradient)" />
  <g filter="url(#glow)">
    <ellipse cx="720" cy="450" rx="320" ry="180" fill="#3ed5ff" fill-opacity="0.08" />
    <ellipse cx="720" cy="450" rx="260" ry="150" fill="#6f52ff" fill-opacity="0.06" />
  </g>
  <circle cx="720" cy="450" r="210" fill="url(#orbGradient)" stroke="#7af1ff" stroke-opacity="0.35" stroke-width="4" />
  <g transform="translate(0,-30)">
    <path d="M240 420 C 420 260 1020 290 1200 420 C 1020 550 420 580 240 420 Z" fill="none" stroke="url(#ribbonGradient)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M280 420 C 480 310 960 320 1160 420" fill="none" stroke="#4cf6ff" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round" stroke-dasharray="30 22" />
    <path d="M1160 420 C 960 530 480 540 280 420" fill="none" stroke="#4cf6ff" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round" stroke-dasharray="24 16" />
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="480" cy="360" r="7" />
    <circle cx="980" cy="340" r="7" />
    <circle cx="980" cy="540" r="7" />
    <circle cx="460" cy="560" r="7" />
  </g>
  <g font-family="'Inter', Arial, sans-serif" font-size="20" fill="#eaffff" text-anchor="middle">
    <g transform="translate(420,300) rotate(-12)">
      <rect x="-120" y="-70" width="240" height="140" rx="18" fill="url(#cardGradient)" stroke="#80f2ff" stroke-opacity="0.35" />
      <text y="-18">Listen &amp; Map</text>
      <text y="18" font-size="14" fill="#cfeaff">Discovery chats, journey maps</text>
    </g>
    <g transform="translate(1040,300) rotate(10)">
      <rect x="-120" y="-70" width="240" height="140" rx="18" fill="url(#cardGradient)" stroke="#80f2ff" stroke-opacity="0.35" />
      <text y="-18">Prototype with Polish</text>
      <text y="18" font-size="14" fill="#cfeaff">Interactive mockups</text>
    </g>
    <g transform="translate(1060,600) rotate(-8)">
      <rect x="-120" y="-70" width="240" height="140" rx="18" fill="url(#cardGradient)" stroke="#80f2ff" stroke-opacity="0.35" />
      <text y="-18">Infuse Helpful AI</text>
      <text y="18" font-size="14" fill="#cfeaff">Calm copilots</text>
    </g>
    <g transform="translate(420,610) rotate(12)">
      <rect x="-120" y="-70" width="240" height="140" rx="18" fill="url(#cardGradient)" stroke="#80f2ff" stroke-opacity="0.35" />
      <text y="-18">Ship &amp; Grow</text>
      <text y="18" font-size="14" fill="#cfeaff">Release rituals</text>
    </g>
  </g>
  <g stroke="#6bcdf8" stroke-opacity="0.4" stroke-width="2">
    <path d="M600 450 C 640 400 800 400 840 450" fill="none" />
    <path d="M600 470 C 650 520 790 520 840 470" fill="none" />
  </g>
  <circle cx="720" cy="450" r="58" fill="#b6f7ff" fill-opacity="0.18" />
  <circle cx="720" cy="450" r="32" fill="#ffffff" fill-opacity="0.12" />
  <circle cx="720" cy="450" r="8" fill="#ffffff" />
</svg>
